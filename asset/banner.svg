<svg width="850" height="260" viewBox="0 0 850 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="850" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="58%" stop-color="#101624"/>
      <stop offset="100%" stop-color="#181226"/>
    </linearGradient>
    <linearGradient id="brandLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#35B5B5"/>
      <stop offset="35%" stop-color="#3B82F6"/>
      <stop offset="68%" stop-color="#C71A64"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <radialGradient id="aura1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.26"/>
      <stop offset="60%" stop-color="#EC4899" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0B0F17" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aura2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#0B0F17" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#334155" fill-opacity="0.32"/>
    </pattern>
  </defs>

  <style>
    .fade-up { opacity: 0; animation: fadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .d1 { animation-delay: 0.10s; }
    .d2 { animation-delay: 0.25s; }
    .d3 { animation-delay: 0.40s; }
    .d4 { animation-delay: 0.55s; }

    .line-anim { stroke-dasharray: 500; stroke-dashoffset: 500; animation: draw 1s cubic-bezier(0.22, 1, 0.36, 1) 0.35s forwards; }
    .pulse-dot { animation: pulse 2.2s ease-in-out infinite; }

    .f {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      animation: popIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .w0 { animation-delay: 0.08s; }
    .w1 { animation-delay: 0.17s; }
    .w2 { animation-delay: 0.26s; }
    .w3 { animation-delay: 0.35s; }
    .w4 { animation-delay: 0.44s; }
    .w5 { animation-delay: 0.53s; }
    .w6 { animation-delay: 0.62s; }
    .w7 { animation-delay: 0.71s; }
    .w8 { animation-delay: 0.80s; }
    .w9 { animation-delay: 0.89s; }

    .m {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      animation: maneIn 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .m1 { animation-delay: 0.96s; }
    .m2 { animation-delay: 1.04s; }
    .m3 { animation-delay: 1.12s; }
    .m4 { animation-delay: 1.20s; }
    .m5 { animation-delay: 1.28s; }

    .eye { opacity: 0; animation: eyeIn 0.35s ease-out 1.32s forwards; }
    .horse-float { animation: floatY 5s ease-in-out 1.8s infinite; }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @keyframes popIn { from { opacity: 0; transform: translateY(10px) scale(0.25); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes maneIn { from { opacity: 0; transform: translate(-20px, -6px) scale(0.35) rotate(-18deg); } to { opacity: 1; transform: translate(0, 0) scale(1) rotate(0deg); } }
    @keyframes eyeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes floatY { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-5px); } }
  </style>

  <!-- Sfondo -->
  <rect width="850" height="260" rx="18" fill="url(#bg)"/>
  <rect width="850" height="260" rx="18" fill="url(#grid)"/>
  <circle cx="715" cy="118" r="145" fill="url(#aura1)"/>
  <circle cx="675" cy="175" r="115" fill="url(#aura2)"/>
  <rect x="0.75" y="0.75" width="848.5" height="258.5" rx="17.25" stroke="#263042" stroke-width="1.5"/>

  <!-- Pill status -->
  <g class="fade-up d1">
    <rect x="44" y="32" width="320" height="26" rx="13" fill="#161D2D" stroke="#293548" stroke-width="1"/>
    <circle cx="60" cy="45" r="3.5" fill="#10B981" class="pulse-dot"/>
    <text x="72" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" letter-spacing="1.2" fill="#CBD5E1">
      SORA, ITALY  ·  E-BUSINESS &amp; ENGINEERING
    </text>
  </g>

  <!-- Titolo -->
  <text x="44" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" letter-spacing="-0.5" fill="#F8FAFC" class="fade-up d2">
    Scuderie Digitali
  </text>

  <line x1="44" y1="128" x2="530" y2="128" stroke="url(#brandLine)" stroke-width="2.5" stroke-linecap="round" class="line-anim"/>

  <!-- Sottotitolo -->
  <g class="fade-up d3">
    <text x="44" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#94A3B8">
      Partner tecnologico per architetture SaaS, E-Commerce ad alte
    </text>
    <text x="44" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#94A3B8">
      prestazioni e workflow AI per Retail, Fashion &amp; Luxury.
    </text>
  </g>

  <!-- Pilastri -->
  <g class="fade-up d4">
    <rect x="44" y="202" width="114" height="28" rx="14" fill="#161D2D" stroke="#293548" stroke-width="1"/>
    <circle cx="60" cy="216" r="3.5" fill="#35B5B5"/>
    <text x="72" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">Competenza</text>

    <rect x="168" y="202" width="116" height="28" rx="14" fill="#161D2D" stroke="#293548" stroke-width="1"/>
    <circle cx="184" cy="216" r="3.5" fill="#8B5CF6"/>
    <text x="196" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">Innovazione</text>

    <rect x="294" y="202" width="98" height="28" rx="14" fill="#161D2D" stroke="#293548" stroke-width="1"/>
    <circle cx="310" cy="216" r="3.5" fill="#F97316"/>
    <text x="322" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">Sviluppo</text>
  </g>

  <!-- Cavallo Low-Poly Dinamico -->
  <g transform="translate(612, 26) scale(1.04)">
    <g class="horse-float">
      <circle cx="96" cy="100" r="97" stroke="#263042" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.65"/>

      <g stroke-width="0.65" stroke-linejoin="round">
        <!-- Zoccoli e base (Onda 0-1) -->
        <polygon class="f w0" points="120,166 101,183 94,172" fill="#A8C53B" stroke="#A8C53B"/>
        <polygon class="f w0" points="159,150 151,178 140,170" fill="#A6C43B" stroke="#A6C43B"/>
        <polygon class="f w0" points="30,156 64,150 52,176" fill="#F59423" stroke="#F59423"/>
        <polygon class="f w1" points="64,150 72,162 52,176" fill="#F79E24" stroke="#F79E24"/>
        <polygon class="f w1" points="107,162 120,166 94,172" fill="#F8A824" stroke="#F8A824"/>
        <polygon class="f w1" points="145,150 159,150 140,170" fill="#F69B24" stroke="#F69B24"/>

        <!-- Zampe e basso torso (Onda 2-3) -->
        <polygon class="f w2" points="88,144 72,162 64,150" fill="#EB6C1F" stroke="#EB6C1F"/>
        <polygon class="f w2" points="50,132 64,150 30,156" fill="#F68422" stroke="#F68422"/>
        <polygon class="f w2" points="22,128 50,132 30,156" fill="#F36E22" stroke="#F36E22"/>
        <polygon class="f w2" points="113,149 120,166 107,162" fill="#E5631F" stroke="#E5631F"/>
        <polygon class="f w2" points="129,144 120,166 113,149" fill="#F27E22" stroke="#F27E22"/>
        <polygon class="f w3" points="135,127 159,150 145,150" fill="#DC4422" stroke="#DC4422"/>
        <polygon class="f w3" points="153,123 159,150 135,127" fill="#EA5922" stroke="#EA5922"/>
        <polygon class="f w3" points="104,131 113,149 88,144" fill="#CE3224" stroke="#CE3224"/>
        <polygon class="f w3" points="104,131 129,144 113,149" fill="#DE4122" stroke="#DE4122"/>
        <polygon class="f w3" points="78,124 64,150 50,132" fill="#EC5E22" stroke="#EC5E22"/>
        <polygon class="f w3" points="78,124 88,144 64,150" fill="#F47422" stroke="#F47422"/>

        <!-- Petto e avambraccio (Onda 4-5) -->
        <polygon class="f w4" points="78,124 104,131 88,144" fill="#E64A21" stroke="#E64A21"/>
        <polygon class="f w4" points="106,113 104,131 78,124" fill="#F25A24" stroke="#F25A24"/>
        <polygon class="f w4" points="106,113 124,120 104,131" fill="#EB5624" stroke="#EB5624"/>
        <polygon class="f w4" points="104,131 124,120 135,127" fill="#DC3B23" stroke="#DC3B23"/>
        <polygon class="f w4" points="142,112 135,127 124,120" fill="#F26927" stroke="#F26927"/>
        <polygon class="f w4" points="142,112 153,123 135,127" fill="#F6822E" stroke="#F6822E"/>
        <polygon class="f w4" points="106,113 142,112 124,120" fill="#F57A29" stroke="#F57A29"/>
        <polygon class="f w5" points="32,98 50,132 22,128" fill="#EE4B25" stroke="#EE4B25"/>
        <polygon class="f w5" points="32,98 54,102 50,132" fill="#E2322D" stroke="#E2322D"/>
        <polygon class="f w5" points="54,102 78,124 50,132" fill="#EC4127" stroke="#EC4127"/>
        <polygon class="f w5" points="82,98 78,124 54,102" fill="#DC2734" stroke="#DC2734"/>
        <polygon class="f w5" points="82,98 106,113 78,124" fill="#EA3B2A" stroke="#EA3B2A"/>
        <polygon class="f w5" points="103,94 106,113 82,98" fill="#E32B3E" stroke="#E32B3E"/>

        <!-- Spalle e collo inferiore (Onda 6) -->
        <polygon class="f w6" points="45,70 54,102 32,98" fill="#CC1B4E" stroke="#CC1B4E"/>
        <polygon class="f w6" points="45,70 72,76 54,102" fill="#B91866" stroke="#B91866"/>
        <polygon class="f w6" points="72,76 82,98 54,102" fill="#D41E52" stroke="#D41E52"/>
        <polygon class="f w6" points="95,69 82,98 72,76" fill="#A9196D" stroke="#A9196D"/>
        <polygon class="f w6" points="95,69 103,94 82,98" fill="#C61B5F" stroke="#C61B5F"/>

        <!-- Collo superiore e muso (Onda 7-8) -->
        <polygon class="f w7" points="59,46 72,76 45,70" fill="#8F2288" stroke="#8F2288"/>
        <polygon class="f w7" points="59,46 78,52 72,76" fill="#6D2A90" stroke="#6D2A90"/>
        <polygon class="f w7" points="78,52 95,69 72,76" fill="#882292" stroke="#882292"/>
        <polygon class="f w7" points="95,38 95,69 78,52" fill="#5F278D" stroke="#5F278D"/>
        <polygon class="f w7" points="113,52 106,75 95,69" fill="#551E7C" stroke="#551E7C"/>
        <polygon class="f w7" points="113,52 119,77 106,75" fill="#691F84" stroke="#691F84"/>
        <polygon class="f w8" points="127,68 119,77 113,52" fill="#822089" stroke="#822089"/>
        <polygon class="f w8" points="133,83 119,77 127,68" fill="#9E1A72" stroke="#9E1A72"/>
        <polygon class="f w8" points="142,75 133,83 127,68" fill="#C41E6B" stroke="#C41E6B"/>
        <polygon class="f w8" points="137,64 142,75 127,68" fill="#A81D74" stroke="#A81D74"/>
        <polygon class="f w8" points="126,46 127,68 113,52" fill="#532B8C" stroke="#532B8C"/>
        <polygon class="f w8" points="126,46 137,64 127,68" fill="#6F2B91" stroke="#6F2B91"/>

        <!-- Fronte, testa e orecchio (Onda 9) -->
        <polygon class="f w8" points="76,28 78,52 59,46" fill="#394092" stroke="#394092"/>
        <polygon class="f w8" points="76,28 95,38 78,52" fill="#34669E" stroke="#34669E"/>
        <polygon class="f w8" points="95,38 113,52 95,69" fill="#3C3E94" stroke="#3C3E94"/>
        <polygon class="f w9" points="112,30 113,52 95,38" fill="#2B77B5" stroke="#2B77B5"/>
        <polygon class="f w9" points="112,30 126,46 113,52" fill="#325CA6" stroke="#325CA6"/>
        <polygon class="f w9" points="76,28 95,20 95,38" fill="#52BEB4" stroke="#52BEB4"/>
        <polygon class="f w9" points="95,20 112,30 95,38" fill="#3E9E93" stroke="#3E9E93"/>
        <polygon class="f w9" points="95,20 116,12 112,30" fill="#35B5B5" stroke="#35B5B5"/>
      </g>

      <!-- Occhio -->
      <polygon class="eye" points="111,40 119,45 116,48 112,44" fill="#FFFFFF"/>

      <!-- Criniera che vola in formazione -->
      <polygon class="m m5" points="54,26 68,24 62,16" fill="#45B2A8"/>
      <polygon class="m m5" points="36,34 51,27 46,43" fill="#39958B"/>
      <polygon class="m m4" points="26,46 36,43 32,53" fill="#4FC1B6"/>
      <polygon class="m m4" points="19,60 32,53 29,67" fill="#42489C"/>
      <polygon class="m m3" points="29,68 41,58 37,74" fill="#7A2693"/>
      <polygon class="m m3" points="13,78 24,69 24,85" fill="#AE1970"/>
      <polygon class="m m2" points="20,90 32,80 28,95" fill="#C81A5E"/>
      <polygon class="m m2" points="11,102 22,94 20,109" fill="#DF2838"/>
      <polygon class="m m1" points="12,118 20,109 18,122" fill="#EE4D24"/>
    </g>
  </g>
</svg>
