      <circle cx="216" cy="11" r="3" fill="#E535AB"/>
      <text x="225" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">GraphQL</text>

      <rect x="284" width="78" height="22" rx="11" fill="#1C2436" stroke="#2E3B52"/>
      <circle cx="295" cy="11" r="3" fill="#10B981"/>
      <text x="304" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">REST API</text>
    </g>
  </g>

