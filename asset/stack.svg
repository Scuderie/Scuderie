      <stop offset="0%" stop-color="#0E1420"/>
      <stop offset="100%" stop-color="#0B0F17"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#35B5B5"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
