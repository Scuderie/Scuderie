    .b2 { animation-delay: 0.18s; }
    .b3 { animation-delay: 0.28s; }
    .b4 { animation-delay: 0.38s; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>

