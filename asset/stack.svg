    </g>
  </g>

  <!-- Blocco 4: AI & Automation -->
  <g class="box b4" transform="translate(434, 128)">
    <rect width="394" height="68" rx="12" fill="#131926" stroke="#222C3E" stroke-width="1"/>
    <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#94A3B8">AI Workflows &amp; Operations</text>
    <g transform="translate(16, 35)">
      <rect width="98" height="22" rx="11" fill="#1C2436" stroke="#2E3B52"/>
