      <rect x="202" width="84" height="22" rx="11" fill="#1C2436" stroke="#2E3B52"/>
      <circle cx="213" cy="11" r="3" fill="#EC4899"/>
      <text x="222" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">ERP / CRM</text>

      <rect x="293" width="66" height="22" rx="11" fill="#1C2436" stroke="#2E3B52"/>
      <circle cx="304" cy="11" r="3" fill="#F59E0B"/>
      <text x="313" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">CI / CD</text>
    </g>
