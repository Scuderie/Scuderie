      <circle cx="11" cy="11" r="3" fill="#7AB55C"/>
      <text x="20" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">Shopify</text>

      <rect x="75" width="66" height="22" rx="11" fill="#1C2436" stroke="#2E3B52"/>
      <circle cx="86" cy="11" r="3" fill="#4479A1"/>
      <text x="95" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">MySQL</text>

      <rect x="148" width="88" height="22" rx="11" fill="#1C2436" stroke="#2E3B52"/>
      <circle cx="159" cy="11" r="3" fill="#4169E1"/>
