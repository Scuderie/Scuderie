<svg width="850" height="214" viewBox="0 0 850 214" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .box { opacity: 0; animation: fadeIn 0.6s ease-out forwards; }
    .b1 { animation-delay: 0.1s; }
    .b2 { animation-delay: 0.2s; }
    .b3 { animation-delay: 0.3s; }
    .b4 { animation-delay: 0.4s; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  </style>

  <!-- Container principale -->
  <rect x="0.75" y="0.75" width="848.5" height="212.5" rx="16" fill="#0D1117" stroke="#263042" stroke-width="1.2"/>
  <text x="24" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4" fill="#64748B">
    ENGINEERING STACK &amp; ECOSYSTEM
  </text>

  <!-- Blocco 1: Frontend -->
  <g class="box b1" transform="translate(22, 50)">
    <rect width="394" height="68" rx="12" fill="#131926" stroke="#222C3E" stroke-width="1"/>
    <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#94A3B8">Frontend &amp; Interface</text>
    <!-- Pills -->
    <g transform="translate(16, 35)">
      <rect width="66" height="22" rx="11" fill="#1C2436" stroke="#2E3B52"/>
      <circle cx="11" cy="11" r="3" fill="#E34F26"/>
      <text x="20" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">HTML5</text>

      <rect x="73" width="56" height="22" rx="11" fill="#1C2436" stroke="#2E3B52"/>
      <circle cx="84" cy="11" r="3" fill="#CC6699"/>
      <text x="93" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">SCSS</text>

      <rect x="136" width="84" height="22" rx="11" fill="#1C2436" stroke="#2E3B52"/>
      <circle cx="147" cy="11" r="3" fill="#3178C6"/>
      <text x="156" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">TypeScript</text>

      <rect x="227" width="68" height="22" rx="11" fill="#1C2436" stroke="#2E3B52"/>
      <circle cx="238" cy="11" r="3" fill="#DD0031"/>
      <text x="247" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">Angular</text>

      <rect x="302" width="76" height="22" rx="11" fill="#1C2436" stroke="#2E3B52"/>
      <circle cx="313" cy="11" r="3" fill="#7952B3"/>
      <text x="322" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">Bootstrap</text>
    </g>
  </g>

  <!-- Blocco 2: Backend -->
  <g class="box b2" transform="translate(434, 50)">
    <rect width="394" height="68" rx="12" fill="#131926" stroke="#222C3E" stroke-width="1"/>
    <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#94A3B8">Backend &amp; API Architecture</text>
