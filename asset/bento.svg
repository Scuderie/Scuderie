<svg width="850" height="190" viewBox="0 0 850 190" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="272" y2="182" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0B0F17"/>
    </linearGradient>
    <radialGradient id="glowOrange" cx="88%" cy="14%" r="65%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0B0F17" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="88%" cy="14%" r="65%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#0B0F17" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTeal" cx="88%" cy="14%" r="65%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0B0F17" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cardClip">
      <rect width="272" height="182" rx="16"/>
    </clipPath>
  </defs>

  <style>
    .card {
      opacity: 0;
      animation: rise 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .c1 { animation-delay: 0.08s; }
    .c2 { animation-delay: 0.20s; }
    .c3 { animation-delay: 0.32s; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>

  <!-- Card 1: E-Commerce & Retail -->
  <g transform="translate(0, 4)">
    <g class="card c1">
      <g clip-path="url(#cardClip)">
        <rect width="272" height="182" rx="16" fill="url(#cardBg)"/>
        <rect width="272" height="182" fill="url(#glowOrange)"/>
      </g>
      <rect x="0.6" y="0.6" width="270.8" height="180.8" rx="15.4" stroke="#263042" stroke-width="1.2"/>

      <rect x="20" y="20" width="38" height="38" rx="11" fill="#F97316" fill-opacity="0.14" stroke="#F97316" stroke-opacity="0.35"/>
      <path d="M32 34H46L44.5 44H33.5L32 34ZM36 34V32.5C36 30.8 37.3 29.5 39 29.5C40.7 29.5 42 30.8 42 32.5V34" stroke="#FB923C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="158" y="27" width="94" height="22" rx="11" fill="#1C2436" stroke="#2E3B52" stroke-width="0.9"/>
      <text x="205" y="41.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.8" fill="#FB923C">SHOPIFY · POS</text>

      <text x="20" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">E-Commerce &amp; Retail</text>
      <text x="20" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94A3B8">Storefront Shopify e custom,</text>
      <text x="20" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94A3B8">GraphQL, Webhooks, POS e</text>
      <text x="20" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94A3B8">ottimizzazione Core Web Vitals.</text>
    </g>
  </g>

  <!-- Card 2: Piattaforme SaaS & ERP -->
  <g transform="translate(289, 4)">
    <g class="card c2">
      <g clip-path="url(#cardClip)">
        <rect width="272" height="182" rx="16" fill="url(#cardBg)"/>
        <rect width="272" height="182" fill="url(#glowPurple)"/>
      </g>
      <rect x="0.6" y="0.6" width="270.8" height="180.8" rx="15.4" stroke="#263042" stroke-width="1.2"/>

      <rect x="20" y="20" width="38" height="38" rx="11" fill="#8B5CF6" fill-opacity="0.14" stroke="#8B5CF6" stroke-opacity="0.35"/>
      <path d="M39 30L47 34.5L39 39L31 34.5L39 30ZM31 39.5L39 44L47 39.5M31 44L39 48.5L47 44" stroke="#A78BFA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="156" y="27" width="96" height="22" rx="11" fill="#1C2436" stroke="#2E3B52" stroke-width="0.9"/>
      <text x="204" y="41.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.8" fill="#A78BFA">MULTI-TENANT</text>

      <text x="20" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">Piattaforme SaaS &amp; ERP</text>
      <text x="20" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94A3B8">Architetture scalabili isolate,</text>
      <text x="20" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94A3B8">automazione supply chain e</text>
      <text x="20" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94A3B8">gestionali aziendali su misura.</text>
    </g>
  </g>

  <!-- Card 3: AI & Digital Innovation -->
  <g transform="translate(578, 4)">
    <g class="card c3">
      <g clip-path="url(#cardClip)">
        <rect width="272" height="182" rx="16" fill="url(#cardBg)"/>
        <rect width="272" height="182" fill="url(#glowTeal)"/>
      </g>
      <rect x="0.6" y="0.6" width="270.8" height="180.8" rx="15.4" stroke="#263042" stroke-width="1.2"/>

      <rect x="20" y="20" width="38" height="38" rx="11" fill="#10B981" fill-opacity="0.14" stroke="#10B981" stroke-opacity="0.35"/>
      <path d="M39 30V34M39 44V48M30 39H34M44 39H48M33 33L35.8 35.8M42.2 42.2L45 45M45 33L42.2 35.8M35.8 42.2L33 45" stroke="#34D399" stroke-width="1.8" stroke-linecap="round"/>

      <rect x="162" y="27" width="90" height="22" rx="11" fill="#1C2436" stroke="#2E3B52" stroke-width="0.9"/>
      <text x="207" y="41.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.8" fill="#34D399">MULTI-MODEL</text>

      <text x="20" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">AI &amp; Digital Innovation</text>
      <text x="20" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94A3B8">Orchestrazione pipeline AI,</text>
      <text x="20" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94A3B8">flussi dati intelligenti e</text>
      <text x="20" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94A3B8">integrazioni API enterprise.</text>
    </g>
  </g>
</svg>
