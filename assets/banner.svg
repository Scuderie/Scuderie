<svg width="850" height="240" viewBox="0 0 850 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="850" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="55%" stop-color="#131926"/>
      <stop offset="100%" stop-color="#1A1228"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9333EA" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#F97316" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .facet {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      animation: assemble 0.75s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .f1  { --tx: -30px; --ty: -25px; animation-delay: 0.05s; }
    .f2  { --tx:  20px; --ty: -30px; animation-delay: 0.12s; }
    .f3  { --tx:  35px; --ty: -15px; animation-delay: 0.19s; }
    .f4  { --tx:  40px; --ty:  10px; animation-delay: 0.26s; }
    .f5  { --tx:  15px; --ty:  20px; animation-delay: 0.33s; }
    .f6  { --tx: -35px; --ty: -10px; animation-delay: 0.40s; }
    .f7  { --tx: -25px; --ty:  15px; animation-delay: 0.47s; }
    .f8  { --tx:  30px; --ty:  25px; animation-delay: 0.54s; }
    .f9  { --tx:   0px; --ty:  30px; animation-delay: 0.61s; }
    .f10 { --tx:  35px; --ty:  30px; animation-delay: 0.68s; }
    .f11 { --tx: -15px; --ty:  35px; animation-delay: 0.75s; }
    .f12 { --tx: -40px; --ty:  20px; animation-delay: 0.82s; }
    .f13 { --tx: -20px; --ty:  40px; animation-delay: 0.89s; }
    .f14 { --tx:  20px; --ty:  45px; animation-delay: 0.96s; }
    .f15 { --tx: -30px; --ty:  45px; animation-delay: 1.03s; }

    .horse-group {
      animation: float 4.5s ease-in-out 1.8s infinite;
    }

    .text-reveal {
      opacity: 0;
      animation: fadeSlide 0.8s ease-out 0.9s forwards;
    }
    .sub-reveal {
      opacity: 0;
      animation: fadeSlide 0.8s ease-out 1.25s forwards;
    }
    .line-draw {
      stroke-dasharray: 460;
      stroke-dashoffset: 460;
      animation: drawLine 1.1s ease-out 1.1s forwards;
    }

    @keyframes assemble {
      0% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0.4) rotate(-12deg); }
      100% { opacity: 1; transform: translate(0, 0) scale(1) rotate(0deg); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    @keyframes fadeSlide {
      0% { opacity: 0; transform: translateX(18px); }
      100% { opacity: 1; transform: translateX(0); }
    }
    @keyframes drawLine {
      to { stroke-dashoffset: 0; }
    }
  </style>

  <!-- Sfondo -->
  <rect width="850" height="240" rx="16" fill="url(#bgGrad)"/>
  <rect x="0.75" y="0.75" width="848.5" height="238.5" rx="15.25" stroke="#30363D" stroke-width="1.5"/>
  <circle cx="135" cy="120" r="110" fill="url(#glow)"/>

  <!-- Logo Poligonale Dinamico -->
  <g transform="translate(42, 26)">
    <g class="horse-group">
      <polygon class="facet f1"  points="78,16 92,34 72,38" fill="#10B981"/>
      <polygon class="facet f2"  points="92,34 116,42 94,60" fill="#3B82F6"/>
      <polygon class="facet f3"  points="116,42 144,64 118,70" fill="#6366F1"/>
      <polygon class="facet f4"  points="144,64 136,82 118,70" fill="#7C3AED"/>
      <polygon class="facet f5"  points="94,60 118,70 96,86" fill="#A855F7"/>
      <polygon class="facet f6"  points="72,38 94,60 60,70" fill="#4F46E5"/>
      <polygon class="facet f7"  points="60,70 94,60 76,98" fill="#C026D3"/>
      <polygon class="facet f8"  points="96,86 118,70 110,114" fill="#EC4899"/>
      <polygon class="facet f9"  points="76,98 96,86 110,114" fill="#E11D48"/>
      <polygon class="facet f10" points="110,114 138,126 108,148" fill="#F97316"/>
      <polygon class="facet f11" points="76,98 110,114 84,142" fill="#EF4444"/>
      <polygon class="facet f12" points="60,70 76,98 50,120" fill="#DB2777"/>
      <polygon class="facet f13" points="50,120 76,98 84,142" fill="#F43F5E"/>
      <polygon class="facet f14" points="84,142 108,148 96,174" fill="#FB923C"/>
      <polygon class="facet f15" points="50,120 84,142 62,166" fill="#F59E0B"/>
    </g>
  </g>

  <!-- Testo -->
  <text x="255" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" letter-spacing="1.5" fill="url(#titleGrad)" class="text-reveal">
    SCUDERIE DIGITALI
  </text>

  <line x1="255" y1="122" x2="715" y2="122" stroke="#F97316" stroke-width="2" stroke-linecap="round" class="line-draw"/>

  <text x="255" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="2.2" fill="#94A3B8" class="sub-reveal">
    COMPETENZA · INNOVAZIONE · SVILUPPO
  </text>

  <text x="255" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#64748B" class="sub-reveal">
    Full-Stack Engineering · Fashion &amp; Luxury E-Business · AI Workflows
  </text>
</svg>
